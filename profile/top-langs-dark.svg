<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">&lt;tspan style=&quot;opacity: 0.62&quot;&gt;bad3r.&lt;/tspan&gt;languages</title>
  <desc id="descId">Most used languages by bytes written: Nix 26.1%, Python 23.3%, C# 15.2%, JavaScript 12.9%, TypeScript 11.9%, Shell 10.6%</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .path { font-size: 11.5px; font-weight: 500; fill: #8080FF; }
    .meta { font-size: 11.5px; font-weight: 500; fill: #8B86AB; }
    .prose { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #8B86AB; }
    .hero {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.035em;
      fill: #E5E2F6;
    }
    .hero-key { font-size: 12.5px; font-weight: 500; fill: #E5E2F6; }
    .num {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      fill: #E5E2F6;
    }
    .key { font-size: 11px; font-weight: 500; fill: #8B86AB; }
    .item { font-size: 12.5px; font-weight: 500; fill: #E5E2F6; }
    .item-dim { font-size: 12.5px; font-weight: 500; fill: #8B86AB; }
    .in { opacity: 0; animation: in 0.45s ease-out forwards; }
    @keyframes in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bleed {
      from { width: 0; }
      to { width: 495px; }
    }
    .bleed { animation: bleed 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards; }
    @media (prefers-reduced-motion: reduce) {
      .in { animation: none; opacity: 1; }
      .bleed { animation: none; }
    }

  </style>
  <clipPath id="card">
    <rect x="0" y="0" width="495" height="195" rx="8" />
  </clipPath>
  <rect
    x="0.5"
    y="0.5"
    width="494"
    height="194"
    rx="7.5"
    fill="#12111C"
    stroke="#2C2A42"
  />
  <text class="path in" x="24" y="31"><tspan style="opacity: 0.62">bad3r.</tspan>languages</text>
  <text
    class="meta in"
    x="471"
    y="31"
    text-anchor="end"
    style="animation-delay: 70ms"
  >88 repos · by bytes</text>
  <g class="in" style="animation-delay: 140ms">
    <text
      class="hero"
      x="24"
      y="108"
      style="font-size: 44.0px; fill: #7e7eff"
    >Nix</text>
    <text class="hero-key" x="24" y="132">26.1%</text>
    <text class="prose" x="70.5" y="132">of all bytes written</text>
  </g>
  <g class="in" style="animation-delay: 260ms">
    <circle cx="252" cy="62" r="4" fill="#3572A5" />
    <text class="item" x="268" y="66">Python</text>
    <text class="item-dim" x="471" y="66" text-anchor="end">23.3%</text>
  </g>
  <g class="in" style="animation-delay: 320ms">
    <circle cx="252" cy="88" r="4" fill="#7355dd" />
    <text class="item" x="268" y="92">C#</text>
    <text class="item-dim" x="471" y="92" text-anchor="end">15.2%</text>
  </g>
  <g class="in" style="animation-delay: 380ms">
    <circle cx="252" cy="114" r="4" fill="#f1e05a" />
    <text class="item" x="268" y="118">JavaScript</text>
    <text class="item-dim" x="471" y="118" text-anchor="end">12.9%</text>
  </g>
  <g class="in" style="animation-delay: 440ms">
    <circle cx="252" cy="140" r="4" fill="#3178c6" />
    <text class="item" x="268" y="144">TypeScript</text>
    <text class="item-dim" x="471" y="144" text-anchor="end">11.9%</text>
  </g>
  <g class="in" style="animation-delay: 500ms">
    <circle cx="252" cy="166" r="4" fill="#89e051" />
    <text class="item" x="268" y="170">Shell</text>
    <text class="item-dim" x="471" y="170" text-anchor="end">10.6%</text>
  </g>
  <clipPath id="strip">
    <rect class="bleed" x="0" y="190" width="495" height="5" />
  </clipPath>
  <g clip-path="url(#card)">
    <g clip-path="url(#strip)">
      <rect x="0.00" y="190" width="129.22" height="5" fill="#7e7eff" />
      <rect x="129.22" y="190" width="115.30" height="5" fill="#3572A5" />
      <rect x="244.53" y="190" width="75.39" height="5" fill="#7355dd" />
      <rect x="319.92" y="190" width="63.61" height="5" fill="#f1e05a" />
      <rect x="383.53" y="190" width="58.88" height="5" fill="#3178c6" />
      <rect x="442.41" y="190" width="52.59" height="5" fill="#89e051" />
    </g>
  </g>
</svg>
