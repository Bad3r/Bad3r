<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">&lt;tspan style=&quot;opacity: 0.62&quot;&gt;bad3r.&lt;/tspan&gt;contributions</title>
  <desc id="descId">16738 contributions since Feb 2017, 100% of them public. 14337 public commits, 5 private contributions, 1751 pull requests, 365 issues, 225 stars, rank A+.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .path { font-size: 11.5px; font-weight: 500; fill: #5654E0; }
    .meta { font-size: 11.5px; font-weight: 500; fill: #605B84; }
    .prose { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #605B84; }
    .hero {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.035em;
      fill: #191730;
    }
    .hero-key { font-size: 12.5px; font-weight: 500; fill: #191730; }
    .num {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      fill: #191730;
    }
    .key { font-size: 11px; font-weight: 500; fill: #605B84; }
    .item { font-size: 12.5px; font-weight: 500; fill: #191730; }
    .item-dim { font-size: 12.5px; font-weight: 500; fill: #605B84; }
    .in { opacity: 0; animation: in 0.45s ease-out forwards; }
    @keyframes in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bleed {
      from { width: 0; }
      to { width: 495px; }
    }
    .bleed { animation: bleed 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards; }
    @media (prefers-reduced-motion: reduce) {
      .in { animation: none; opacity: 1; }
      .bleed { animation: none; }
    }

  </style>
  <clipPath id="card">
    <rect x="0" y="0" width="495" height="195" rx="8" />
  </clipPath>
  <rect
    x="0.5"
    y="0.5"
    width="494"
    height="194"
    rx="7.5"
    fill="#F6F5FC"
    stroke="#DEDBF1"
  />
  <text class="path in" x="24" y="31"><tspan style="opacity: 0.62">bad3r.</tspan>contributions</text>
  <text
    class="meta in"
    x="471"
    y="31"
    text-anchor="end"
    style="animation-delay: 70ms"
  >5 private · rank A+</text>
  <g class="in" style="animation-delay: 140ms">
    <text class="hero" x="24" y="100">16,738</text>
    <text class="hero-key" x="200.4" y="88">contributions</text>
    <text class="prose" x="200.4" y="103">since Feb 2017</text>
  </g>
  <g class="in" style="animation-delay: 240ms">
    <text class="num" x="24.0" y="150">14,337</text>
    <text class="key" x="24.0" y="166">commits</text>
  </g>
  <g class="in" style="animation-delay: 300ms">
    <text class="num" x="171.2" y="150">1,751</text>
    <text class="key" x="171.2" y="166">pullRequests</text>
  </g>
  <g class="in" style="animation-delay: 360ms">
    <text class="num" x="322.0" y="150">365</text>
    <text class="key" x="322.0" y="166">issues</text>
  </g>
  <g class="in" style="animation-delay: 420ms">
    <text class="num" x="433.2" y="150">225</text>
    <text class="key" x="433.2" y="166">stars</text>
  </g>
  <clipPath id="strip">
    <rect class="bleed" x="0" y="190" width="495" height="5" />
  </clipPath>
  <g clip-path="url(#card)">
    <g clip-path="url(#strip)">
      <rect x="0.00" y="190" width="494.85" height="5" fill="#5654E0" />
      <rect x="494.85" y="190" width="0.15" height="5" fill="#DCD8F0" />
    </g>
  </g>
</svg>
