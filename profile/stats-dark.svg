<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">BAD3R · SINCE FEB 2017</title>
  <desc id="descId">4126 public commits, 10066 private contributions, 1728 pull requests, 363 issues, 223 stars, rank A+</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .key {
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 0.13em;
      fill: #7C7899;
    }
    .key-on { fill: #7E7EFF; }
    .num {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      fill: #D7D4EA;
    }
    .val { font-size: 11px; font-weight: 500; fill: #D7D4EA; }
    .val-dim { font-size: 11px; font-weight: 500; fill: #7C7899; }
    .in { opacity: 0; animation: in 0.5s ease-out forwards; }
    @keyframes in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wipe {
      from { width: 0; }
      to { width: 451px; }
    }
    .wipe { animation: wipe 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .in { animation: none; opacity: 1; }
      .wipe { animation: none; }
    }

  </style>
  <rect
    x="0.5"
    y="0.5"
    width="494"
    height="194"
    rx="7.5"
    fill="#14131F"
    stroke="#2E2C44"
  />
  <text class="key key-on in" x="22" y="27">BAD3R · SINCE FEB 2017</text>
  <text class="key in" x="473" y="27" text-anchor="end" style="animation-delay: 80ms">20 REPOS CONTRIBUTED · RANK A+</text>
  <line x1="22" y1="38" x2="473" y2="38" stroke="#282640" />
    <g class="in" style="animation-delay: 140ms">
      <text class="num" x="22.0" y="88">4,126</text>
      <text class="key" x="22.0" y="105">PUBLIC COMMITS</text>
    </g>
    <g class="in" style="animation-delay: 210ms">
      <text class="num" x="133.3" y="88">10,066</text>
      <text class="key" x="133.3" y="105">PRIVATE</text>
    </g>
    <g class="in" style="animation-delay: 280ms">
      <text class="num" x="250.4" y="88">1,728</text>
      <text class="key" x="250.4" y="105">PULL REQUESTS</text>
    </g>
    <g class="in" style="animation-delay: 350ms">
      <text class="num" x="356.0" y="88">363</text>
      <text class="key" x="356.0" y="105">ISSUES</text>
    </g>
    <g class="in" style="animation-delay: 420ms">
      <text class="num" x="429.8" y="88">223</text>
      <text class="key" x="429.8" y="105">STARS</text>
    </g>
    <clipPath id="wipe">
      <rect class="wipe" x="22" y="140" width="451" height="7" rx="3.5" />
    </clipPath>
    <g clip-path="url(#wipe)">
      <rect x="22.00" y="140" width="280.10" height="7" fill="#7E7EFF" />
      <rect x="302.10" y="140" width="170.90" height="7" fill="#26243A" />
    </g>
    <text class="key key-on in" x="22" y="168" style="animation-delay: 620ms">62% PUBLIC CONTRIBUTIONS</text>
    <text class="key in" x="473" y="168" text-anchor="end" style="animation-delay: 660ms">38% UNLISTED</text>
</svg>
