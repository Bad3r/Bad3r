<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Nix 30.77%, Python 26.28%, JavaScript 17.08%, Shell 13.04%, TypeScript 8.31%, PHP 4.52%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f80ed;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header { font-size: 15.5px; }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 12px; }
    }
    .bold { font-weight: 700; }
    .icon { fill: #4c71f2; }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #434d58;
    }
    #rect-mask rect { animation: slideInAnimation 1s ease-in-out forwards; }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: 445px; }
    }
  </style>
  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    width="494"
    height="194"
    fill="#fffefe"
    stroke="#e4e2e2"
    stroke-opacity="1"
  />
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <g transform="translate(0, 55)">
    <svg x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="445" height="8" fill="white" rx="5" />
