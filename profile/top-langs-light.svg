    .wipe { animation: wipe 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .in { animation: none; opacity: 1; }
      .wipe { animation: none; }
    }

