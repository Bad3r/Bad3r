        height="8"
        fill="#4F5D95"
      />
      <g transform="translate(0, 53)">
      <g transform="translate(0, 0)">
        <g transform="translate(0, 0)">
          <g class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="6" r="5" fill="#7e7eff" />
